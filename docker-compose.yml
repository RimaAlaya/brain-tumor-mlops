version: '3.8'

services:
  # API Service - Serves predictions
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: brain-tumor-api:latest
    container_name: brain-tumor-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=/app/models/brain_tumor_model.keras
      - TF_CPP_MIN_LOG_LEVEL=2
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - brain-tumor-net
    depends_on:
      - prometheus

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: brain-tumor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - brain-tumor-net
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: brain-tumor-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - brain-tumor-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # Training Service (run on-demand)
  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    image: brain-tumor-train:latest
    container_name: brain-tumor-train
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - MLFLOW_TRACKING_URI=file:///app/mlruns
    networks:
      - brain-tumor-net
    profiles:
      - training

  # MLflow UI Service (optional)
  mlflow:
    image: python:3.10-slim
    container_name: brain-tumor-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    working_dir: /
    command: >
      bash -c "pip install mlflow==2.9.2 &&
               mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns"
    networks:
      - brain-tumor-net
    profiles:
      - mlflow

networks:
  brain-tumor-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

# Usage Commands:
# ================
#
# Start API with monitoring:
#   docker-compose up -d
#
# Start with MLflow:
#   docker-compose --profile mlflow up -d
#
# Run training:
#   docker-compose --profile training run --rm train
#
# View Prometheus: http://localhost:9090
# View Grafana: http://localhost:3000 (admin/admin)
# View API docs: http://localhost:8000/docs
# View Metrics: http://localhost:8000/metrics
#
# View logs:
#   docker-compose logs -f api
#   docker-compose logs -f prometheus
#   docker-compose logs -f grafana
#
# Stop everything:
#   docker-compose down
#
# Remove everything including volumes:
#   docker-compose down -v